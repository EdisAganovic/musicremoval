[project]
name = "demucspleeter"
version = "0.0.19"
description = "AI-powered vocal separation using Demucs and Spleeter with YouTube downloader"
readme = "README.md"
requires-python = ">=3.11.0, <3.12.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "demucs",
    "spleeter",
    "torch",
    "torchaudio",
    "torchcodec==0.11.1",
    "requests",
    "colorama",
    "tqdm",
    "soundfile",
    "yt-dlp",
    "python-multipart",
    "psutil",
    "watchfiles",
    "websockets<14.0.0",
    "numpy<2.0.0",
    "scipy<1.14.0",
    "httpx>=0.24.0",
    "resampy",
    "audio-separator>=0.47.0",
    "onnxruntime-gpu==1.20.2",
    "onnx",
    "pydub",
    "samplerate",
    "ml-collections",
    "beartype",
    "einops",
    "rotary-embedding-torch",
    "julius",
]

[project.scripts]
demucspleeter = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "main.py"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
required-environments = ["sys_platform == 'win32'"]
override-dependencies = [
    "tensorflow-io-gcs-filesystem==0.31.0; sys_platform == 'win32'",
    "httpx>=0.24.0",
    "numba==0.67.0",
    "llvmlite==0.49.0",
    "librosa==0.11.0",
    "resampy==0.4.3",
    "numpy==1.26.4",
    "protobuf>=4.25.1",
    "typing-extensions>=4.12.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv.workspace]
members = [
    "spleeter_env",
]
